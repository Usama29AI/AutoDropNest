<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoDropNest - Winning Dropshipping Products</title>
    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #10b981;
            --dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark);
            color: var(--text-main);
            padding-bottom: 50px;
        }

        header {
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid #334155;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            color: #fff;
        }

        .logo span {
            color: var(--primary);
        }

        .badge-free {
            background: var(--secondary);
            color: #000;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        .section-title {
            margin: 25px 0 15px 0;
            font-size: 1.3rem;
            border-left: 4px solid var(--primary);
            padding-left: 10px;
        }

        /* Category Filter Chips */
        .category-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .chip {
            background: #1e293b;
            border: 1px solid #334155;
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            white-space: nowrap;
            cursor: pointer;
        }

        .chip.active {
            background: var(--primary);
            border-color: var(--primary);
            font-weight: bold;
        }

        /* Search Input Box */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box input {
            flex-grow: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #1e293b;
            color: #fff;
            font-size: 0.95rem;
        }

        .search-box button {
            padding: 12px 20px;
            background: var(--primary);
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid #334155;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .winning-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #ef4444;
            color: #fff;
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #0f172a;
        }

        .product-details {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-title {
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .profit-text {
            color: var(--secondary);
            font-weight: bold;
        }

        .btn-action {
            width: 100%;
            padding: 10px;
            background: var(--primary);
            border: none;
            color: #fff;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Profit Calculator */
        .calculator-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            margin-top: 25px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
        }

        .result-box {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Auto<span>DropNest</span></div>
        <div class="badge-free">1 Month Free Trial</div>
    </header>

    <div class="container">

        <!-- Search Bar -->
        <h2 class="section-title">Explore Winning Products</h2>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search product name or keyword...">
            <button onclick="handleSearch()">Search</button>
        </div>

        <!-- Category Scroll Filters -->
        <div class="category-scroll">
            <button class="chip active" onclick="filterCategory('all', this)">🔥 All Trending</button>
            <button class="chip" onclick="filterCategory('tech', this)">⚡ Electronics & Tech</button>
            <button class="chip" onclick="filterCategory('home', this)">🏠 Home & Kitchen</button>
            <button class="chip" onclick="filterCategory('beauty', this)">✨ Beauty & Health</button>
        </div>

        <!-- Dynamic Product Grid -->
        <div class="product-grid" id="productGrid">
            <!-- Automated Products will load here automatically -->
        </div>

        <!-- Profit Calculator -->
        <h2 class="section-title">Instant Margin Calculator</h2>
        <div class="calculator-box">
            <div class="form-group">
                <label>Supplier Cost ($)</label>
                <input type="number" id="costPrice" value="12" oninput="calculateProfit()">
            </div>
            <div class="form-group">
                <label>Target Selling Price ($)</label>
                <input type="number" id="sellPrice" value="39.99" oninput="calculateProfit()">
            </div>
            <div class="form-group">
                <label>Estimated Marketing Cost ($)</label>
                <input type="number" id="adCost" value="9" oninput="calculateProfit()">
            </div>
            <div class="result-box">
                <div>Net Margin Per Sale:</div>
                <h3 id="netProfitResult" style="color: #10b981; margin-top: 5px;">$18.99 (47.49%)</h3>
            </div>
        </div>

    </div>

    <script>
        // Curated Automated Winning Products Database
        const winningProducts = [
            { id: 1, title: "4K HD Mini Foldable Obstacle Avoidance Drone", category: "tech", cost: 24.50, sell: 79.99, image: "https://images.unsplash.com/photo-1527977966376-1c8408f9f108?w=500", badge: "🔥 85% Viral Score" },
            { id: 2, title: "Ultra Wireless Waterproof Smart Fitness Tracker", category: "tech", cost: 9.80, sell: 34.99, image: "https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=500", badge: "⚡ High Margin" },
            { id: 3, title: "Galaxy Starry Sky Night Light Projector", category: "home", cost: 13.20, sell: 42.99, image: "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=500", badge: "⭐ Top Seller" },
            { id: 4, title: "Portable Wireless Blender & Juicer Bottle", category: "home", cost: 11.50, sell: 38.99, image: "https://images.unsplash.com/photo-1570222094114-d054a817e56b?w=500", badge: "🔥 TikTok Viral" },
            { id: 5, title: "Pro LED Ring Light with Extendable Tripod", category: "tech", cost: 14.99, sell: 49.99, image: "https://images.unsplash.com/photo-1616423642757-61163484f9b8?w=500", badge: "📈 Rising Trend" },
            { id: 6, title: "Ultrasonic Facial Cleaner & Skin Scrubber", category: "beauty", cost: 7.40, sell: 29.99, image: "https://images.unsplash.com/photo-1560750588-73207b1ef5b8?w=500", badge: "✨ High Demand" }
        ];

        window.onload = function() {
            renderProducts(winningProducts);
        };

        function renderProducts(items) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            items.forEach(item => {
                const estProfit = (item.sell - item.cost).toFixed(2);
                grid.innerHTML += `
                    <div class="product-card">
                        <span class="winning-tag">${item.badge}</span>
                        <img src="${item.image}" alt="${item.title}">
                        <div class="product-details">
                            <div class="product-title">${item.title}</div>
                            <div class="price-row"><span>Supplier Cost:</span> <span>$${item.cost.toFixed(2)}</span></div>
                            <div class="price-row"><span>Suggested Retail:</span> <span>$${item.sell.toFixed(2)}</span></div>
                            <div class="price-row"><span>Est. Profit Margin:</span> <span class="profit-text">+$${estProfit}</span></div>
                            <button class="btn-action" onclick="loadToCalculator(${item.cost}, ${item.sell})">Sync to Calculator</button>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(cat, el) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');

            if (cat === 'all') {
                renderProducts(winningProducts);
            } else {
                const filtered = winningProducts.filter(p => p.category === cat);
                renderProducts(filtered);
            }
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) {
                renderProducts(winningProducts);
                return;
            }

            const results = winningProducts.filter(p => p.title.toLowerCase().includes(query) || p.category.includes(query));
            
            if (results.length > 0) {
                renderProducts(results);
            } else {
                // Fetch external fallback API seamlessly if query not in local list
                fetchExternalAPI(query);
            }
        }

        async function fetchExternalAPI(query) {
            try {
                const res = await fetch(`https://dummyjson.com/products/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();
                
                if (data.products && data.products.length > 0) {
                    const formatted = data.products.map(p => ({
                        id: p.id,
                        title: p.title,
                        category: "tech",
                        cost: p.price,
                        sell: parseFloat((p.price * 2.3).toFixed(2)),
                        image: p.thumbnail,
                        badge: "🌐 Live API Match"
                    }));
                    renderProducts(formatted);
                } else {
                    renderProducts(winningProducts); // Fallback to winning list if no results
                }
            } catch (err) {
                renderProducts(winningProducts);
            }
        }

        function loadToCalculator(cost, sell) {
            document.getElementById('costPrice').value = cost;
            document.getElementById('sellPrice').value = sell;
            calculateProfit();
            window.scrollTo({ top: document.querySelector('.calculator-box').offsetTop - 80, behavior: 'smooth' });
        }

        function calculateProfit() {
            const cost = parseFloat(document.getElementById('costPrice').value) || 0;
            const sell = parseFloat(document.getElementById('sellPrice').value) || 0;
            const ad = parseFloat(document.getElementById('adCost').value) || 0;

            const profit = sell - (cost + ad);
            const margin = sell > 0 ? ((profit / sell) * 100).toFixed(2) : 0;

            const resultElement = document.getElementById('netProfitResult');
            resultElement.innerText = `$${profit.toFixed(2)} (${margin}%)`;
            resultElement.style.color = profit >= 0 ? '#10b981' : '#ef4444';
        }
    </script>
</body>
</html>
