<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoDropNest - Dropshipping Automation Platform</title>
    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #10b981;
            --dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark);
            color: var(--text-main);
            padding-bottom: 50px;
        }

        header {
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid #334155;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            color: #fff;
        }

        .logo span {
            color: var(--primary);
        }

        .badge-free {
            background: var(--secondary);
            color: #000;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        .section-title {
            margin: 25px 0 15px 0;
            font-size: 1.3rem;
            border-left: 4px solid var(--primary);
            padding-left: 10px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-box input {
            flex-grow: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #1e293b;
            color: #fff;
            font-size: 0.95rem;
        }

        .search-box button {
            padding: 12px 20px;
            background: var(--primary);
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid #334155;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #0f172a;
        }

        .product-details {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-title {
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .profit-text {
            color: var(--secondary);
            font-weight: bold;
        }

        .btn-action {
            width: 100%;
            padding: 10px;
            background: var(--primary);
            border: none;
            color: #fff;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .calculator-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
        }

        .result-box {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
        }

        #statusText {
            font-size: 0.85rem;
            color: var(--secondary);
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Auto<span>DropNest</span></div>
        <div class="badge-free">1 Month Free Trial</div>
    </header>

    <div class="container">

        <!-- Real Live API Search Bar -->
        <h2 class="section-title">AliExpress Live Search Engine</h2>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Type keyword (e.g. drone, watch, phone, lamp)...">
            <button onclick="searchLiveAPI()">Search API</button>
        </div>
        <div id="statusText">Fetching live product details...</div>

        <!-- Product Display Grid -->
        <h2 class="section-title">Winning Products Directory</h2>
        <div class="product-grid" id="productGrid">
            <!-- Dynamic API products will be injected here -->
        </div>

        <!-- Profit Calculator -->
        <h2 class="section-title">Smart Profit Calculator</h2>
        <div class="calculator-box">
            <div class="form-group">
                <label>Supplier Cost ($)</label>
                <input type="number" id="costPrice" value="10" oninput="calculateProfit()">
            </div>
            <div class="form-group">
                <label>Your Selling Price ($)</label>
                <input type="number" id="sellPrice" value="35" oninput="calculateProfit()">
            </div>
            <div class="form-group">
                <label>Est. Ad Cost per Sale ($)</label>
                <input type="number" id="adCost" value="8" oninput="calculateProfit()">
            </div>
            <div class="result-box">
                <div>Net Margin Per Order:</div>
                <h3 id="netProfitResult" style="color: #10b981; margin-top: 5px;">$17.00 (48.57%)</h3>
            </div>
        </div>

    </div>

    <script>
        // Initial Default Search Query on Load
        window.onload = function() {
            fetchProducts('drone');
        };

        function searchLiveAPI() {
            const query = document.getElementById('searchInput').value.trim();
            if(!query) {
                alert('Please enter a product keyword like "drone" or "watch"');
                return;
            }
            fetchProducts(query);
        }

        async function fetchProducts(query) {
            const status = document.getElementById('statusText');
            status.style.display = 'block';
            status.innerText = `Searching suppliers for "${query}"...`;

            try {
                // Free Public E-commerce API Search
                const response = await fetch(`https://dummyjson.com/products/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                status.style.display = 'none';

                if (data.products && data.products.length > 0) {
                    renderProducts(data.products);
                } else {
                    alert(`No direct supplier match found for "${query}". Try generic keywords like "phone", "watch", "lamp" or "bag".`);
                }
            } catch (error) {
                status.innerText = "API Network error. Please try again.";
                console.error(error);
            }
        }

        function renderProducts(items) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            items.forEach(item => {
                const supplierCost = parseFloat(item.price);
                const targetSell = (supplierCost * 2.2).toFixed(2); // 2.2x Auto Markup
                const estProfit = (targetSell - supplierCost).toFixed(2);
                const imgUrl = item.thumbnail || item.images[0] || 'https://via.placeholder.com/300';

                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${imgUrl}" alt="${item.title}">
                        <div class="product-details">
                            <div class="product-title">${item.title}</div>
                            <div class="price-row"><span>Supplier Cost:</span> <span>$${supplierCost.toFixed(2)}</span></div>
                            <div class="price-row"><span>Target Sell Price:</span> <span>$${targetSell}</span></div>
                            <div class="price-row"><span>Net Est. Profit:</span> <span class="profit-text">+$${estProfit}</span></div>
                            <button class="btn-action" onclick="loadToCalculator(${supplierCost}, ${targetSell})">Load to Calculator</button>
                        </div>
                    </div>
                `;
            });
        }

        function loadToCalculator(cost, sell) {
            document.getElementById('costPrice').value = cost;
            document.getElementById('sellPrice').value = sell;
            calculateProfit();
            window.scrollTo({ top: document.querySelector('.calculator-box').offsetTop - 80, behavior: 'smooth' });
        }

        function calculateProfit() {
            const cost = parseFloat(document.getElementById('costPrice').value) || 0;
            const sell = parseFloat(document.getElementById('sellPrice').value) || 0;
            const ad = parseFloat(document.getElementById('adCost').value) || 0;

            const profit = sell - (cost + ad);
            const margin = sell > 0 ? ((profit / sell) * 100).toFixed(2) : 0;

            const resultElement = document.getElementById('netProfitResult');
            resultElement.innerText = `$${profit.toFixed(2)} (${margin}%)`;
            resultElement.style.color = profit >= 0 ? '#10b981' : '#ef4444';
        }
    </script>
</body>
</html>
